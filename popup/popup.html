<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
  <title>Tool for Avito</title>
</head>
<body>
  <div class="popup">
    <header class="popup-header">
      <div class="popup-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="9" width="13" height="13" rx="2"/>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
        </svg>
      </div>
      <h1>Tool for Avito</h1>
    </header>

    <div class="popup-status" id="status">
      <div class="status-dot" id="status-dot"></div>
      <span id="status-text">Проверка…</span>
    </div>

    <button class="popup-btn" id="btn-parse" disabled>
      Собрать объявления
    </button>

    <!-- Block: Saved Session (Сохранённые лоты) -->
    <div class="popup-saved" id="saved-session" style="display:none">
      <div class="popup-saved-header">
        <span class="popup-saved-title">Сохранённые лоты</span>
        <span class="popup-saved-badge" id="saved-badge">0</span>
      </div>

      <div class="popup-saved-info">
        <div class="popup-saved-query" id="saved-query">—</div>
        <div class="popup-saved-date" id="saved-date">—</div>
      </div>

      <div class="popup-saved-actions">
        <button class="popup-sub-btn popup-sub-btn-primary" id="btn-open-session" title="Открыть лоты в боковой панели или на Авито">
          Показать лоты
        </button>
        <button class="popup-sub-btn" id="btn-toggle-list" title="Посмотреть список прямо в попапе">
          Список ▾
        </button>
      </div>

      <button class="popup-clear-session-btn" id="btn-clear-session" type="button">
        Удалить сохранённые лоты
      </button>
      <div class="popup-clear-confirm" id="clear-session-confirm" hidden>
        <span>Удалить сохранённые данные?</span>
        <button class="popup-clear-confirm-action" id="confirm-clear-session" type="button">Удалить</button>
        <button class="popup-clear-confirm-cancel" id="cancel-clear-session" type="button">Отмена</button>
      </div>

      <div class="popup-export-section">
        <span class="popup-export-label">Быстрый экспорт:</span>
        <div class="popup-export-buttons">
          <button class="popup-export-btn" data-format="md" title="Скопировать Markdown">Markdown</button>
          <button class="popup-export-btn" data-format="json" title="Скопировать JSON">JSON</button>
          <button class="popup-export-btn" data-format="tsv" title="Скопировать TSV (Excel)">TSV</button>
        </div>
      </div>

      <div class="popup-lots-preview" id="lots-preview" style="display:none">
        <div class="popup-lots-list" id="lots-list"></div>
      </div>
    </div>

    <div class="popup-toast" id="popup-toast" style="display:none"></div>

    <div class="popup-settings">
      <label class="popup-select-label">
        Формат по умолчанию
        <select id="default-format">
          <option value="md">Markdown</option>
          <option value="json">JSON</option>
          <option value="tsv">TSV</option>
        </select>
      </label>
    </div>
  </div>

  <script src="../shared/parser.js"></script>
  <script src="popup.js"></script>
</body>
</html>
